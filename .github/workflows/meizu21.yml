name: 魅族 21 GKI 构建

# 只有手动触发：workflow_dispatch.inputs 上限 10 个（GitHub 硬限制，超限会让整个 workflow
# 注册失败 → run 里 0 job，且不报语法错）。push 触发在历史上也踩过 0 job 的坑，别加。
on:
  workflow_dispatch:
    inputs:
      hook_backend:
        description: 'FinaSU syscall hook 后端'
        required: true
        default: inline
        type: choice
        options: [inline, tracepoint]
      strict_kcfi:
        description: '门禁 3（kCFI）是否硬失败（run#6 实测 21 MATCH+3 N/A，默认硬）'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      publish:
        description: '是否发布 release + 更新 dist 分支'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      emit_v2_digest:
        description: '是否额外产出 v2（重算 AVB digest）镜像'
        required: true
        default: 'true'
        type: choice
        options: ['true', 'false']
      finasu_ref:
        description: 'FinaSU 版本：latest=每次取最新 release（推荐）；也可填 tag（如 v1.5.0）'
        required: false
        default: latest
        type: string
  # 说明：本 token 没有 Actions:write，无法用 API dispatch；push 到 main 也会触发。
  # push 触发时 inputs 为空，下面 job 级 env 用 `|| '默认值'` 兜底。
  push:
    branches: [main]
    # 只刷缓存不算构建：避免改 cache-trigger.txt 时白跑一次 40 分钟的内核编译
    paths-ignore:
      - 'cache-trigger.txt'
      - '.github/workflows/prepare-cache.yml'
      - 'scripts/prepare_cache.sh'
      - 'scripts/restore_cache.sh'

permissions:
  contents: write

concurrency:
  group: meizu21-gki
  # 注意：跑长编译时一般要求 false；这里临时设 true 是为了让新 run 取消卡住的旧 run。
  # 等流水线稳定后可以改回 false。
  cancel-in-progress: true

env:
  # ---- 全部 pin 死，保证可复现 ----
  GKI_SHA: 0d89215310919593150f0ef047f9fd9902e02bc7
  GKI_URL: https://android.googlesource.com/kernel/common/+archive/0d89215310919593150f0ef047f9fd9902e02bc7.tar.gz
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android14-release/clang-r487747c.tar.gz
  CLANG_ID: clang-r487747c
  # FinaSU 不在缓存里：每次构建实时拉最新 release（源码 + APK + 证书都现取现用）
  FINASU_REPO: LyraVoid/FinaSU
  DEVICE_DIR: device/meizu21
  MAKE_JOBS: '4'
  KBUILD_BUILD_USER: build-user
  KBUILD_BUILD_HOST: build-host
  KBUILD_BUILD_VERSION: '1'
  # 魅族 21 原厂内核 banner 的构建时间（逐字符，见 device/meizu21/source.txt）
  KBUILD_BUILD_TIMESTAMP: Wed Oct 28 18:11:17 UTC 2026

jobs:
  build:
    name: 编译 + 门禁 + 重打包
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      HOOK_BACKEND: ${{ inputs.hook_backend || 'inline' }}
      STRICT_KCFI: ${{ inputs.strict_kcfi || 'false' }}
      PUBLISH: ${{ inputs.publish || 'true' }}
      EMIT_V2: ${{ inputs.emit_v2_digest || 'true' }}
      FINASU_INPUT: ${{ inputs.finasu_ref || 'latest' }}

    steps:
      - name: 0. 检出仓库
        uses: actions/checkout@v4

      - name: 1. 清理磁盘 / 打印环境
        run: |
          echo "=== 清理前 ==="; df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift 2>/dev/null || true
          sudo apt-get clean
          echo "=== 清理后 ==="; df -h / | tail -1
          nproc; free -h

      - name: 2. 安装构建依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc bison flex libssl-dev libelf-dev lz4 zstd cpio rsync \
                 dwarves kmod file xz-utils
          which pahole && pahole --version || echo "WARN: pahole 缺失（CONFIG_DEBUG_INFO_BTF=y 会炸）"
          which dtc || true

      - name: 2.5 恢复 Actions 缓存（快路径：工具链 + 上游源码）
        id: src-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ runner.temp }}/toolchain
            common
          # 内容随 GKI pin / clang 版本变化；改结构时把 -v2 往上加
          key: meizu21-upstream-${{ env.GKI_SHA }}-${{ env.CLANG_ID }}-v2

      - name: 3. 准备 clang-r487747c（Actions 缓存 > 仓库 cache 分支 > AOSP）
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/toolchain"
          restored=0
          if [ "${{ steps.src-cache.outputs.cache-hit }}" = "true" ] && [ -x "$(find "$RUNNER_TEMP/toolchain" -type f -name clang -path '*/bin/*' 2>/dev/null | head -1)" ]; then
            restored=1
            echo "[cache] clang 来自 Actions 缓存（快路径）"
          elif timeout 300 bash scripts/restore_cache.sh clang "$RUNNER_TEMP/toolchain"; then
            restored=1
            echo "[cache] clang 来自仓库 cache 分支"
          else
            echo "[cache] 未命中，从 AOSP 下载（约 720 MB / 约 5-7 分钟）"
            ok=0
            for attempt in 1 2 3; do
              echo "[download] clang 第 $attempt 次"
              rm -f "$RUNNER_TEMP/clang.tar.gz"
              if curl -fSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/clang.tar.gz" "$CLANG_URL" \
                 && gzip -t "$RUNNER_TEMP/clang.tar.gz"; then ok=1; break; fi
              echo "[download] 下载失败或被截断，5s 后重试"; sleep 5
            done
            [ "$ok" = 1 ] || { echo "clang 下载 3 次均失败/损坏"; exit 1; }
            ls -la "$RUNNER_TEMP/clang.tar.gz"
            tar -xzf "$RUNNER_TEMP/clang.tar.gz" -C "$RUNNER_TEMP/toolchain"
            rm -f "$RUNNER_TEMP/clang.tar.gz"
            test "$(find "$RUNNER_TEMP/toolchain" -type f | wc -l)" -gt 1000 \
              || { echo "clang 解压后文件数异常，可能下载不完整"; exit 1; }
          fi
          CLANG_BIN="$(dirname "$(find "$RUNNER_TEMP/toolchain" -type f -name clang -path '*/bin/*' | head -1)")"
          test -n "$CLANG_BIN" || { echo "找不到 clang"; exit 1; }
          echo "$CLANG_BIN" >> "$GITHUB_PATH"
          export PATH="$CLANG_BIN:$PATH"
          clang --version | head -2
          clang --version | grep -q "17.0.2" || { echo "clang 版本不是 17.0.2"; exit 1; }
          echo "CLANG_BIN=$CLANG_BIN" >> "$GITHUB_ENV"
          if [ "$restored" = 1 ]; then echo "CLANG_SOURCE=cache" >> "$GITHUB_ENV"; else echo "CLANG_SOURCE=aosp" >> "$GITHUB_ENV"; fi

      - name: 4. 校验设备事实（机型门禁）
        run: |
          set -euo pipefail
          D="$DEVICE_DIR"
          for f in source.txt so.txt boot_header.txt stock_kernel.config stock_Module.symvers \
                   module_kmi_manifest.txt kcfi_expected.txt \
                   avb_template/stock_boot_skeleton.img.zlib avb_template/source.txt; do
            test -f "$D/$f" || { echo "缺少设备事实文件: $D/$f"; exit 1; }
          done
          grep -q '8c899eb3b7fcb65eff6bb4afd015f90984ce50d351eceb7eda7ef06bbc4619f5' "$D/source.txt" \
            || { echo "source.txt 里没有 Flyme 12.7 原厂 boot sha256"; exit 1; }
          grep -q 'meizu21' "$D/source.txt" || { echo "source.txt 不是 meizu21"; exit 1; }
          RELEASE="$(sed -n 's/^kernel_release[[:space:]]*=[[:space:]]*//p' "$D/so.txt")"
          test "$RELEASE" = "6.1.25-android14-11-maybe-dirty" || { echo "so.txt 的 release 串不对: $RELEASE"; exit 1; }
          echo "设备事实 OK: release=$RELEASE"
          wc -l "$D/stock_kernel.config" "$D/stock_Module.symvers" "$D/module_kmi_manifest.txt"

      - name: 5. 准备 GKI 源码 @ pin SHA（Actions 缓存 > 仓库 cache 分支 > AOSP）
        run: |
          set -euo pipefail
          restored=0
          if [ "${{ steps.src-cache.outputs.cache-hit }}" = "true" ] && [ -f common/Makefile ]; then
            restored=1
            echo "[cache] GKI 源码来自 Actions 缓存（快路径）"
          elif timeout 300 bash scripts/restore_cache.sh gki common; then
            restored=1
            echo "[cache] GKI 源码来自仓库 cache 分支"
          else
            echo "[cache] 未命中，从 AOSP 下载（约 216 MB）"
            ok=0
            for attempt in 1 2 3; do
              echo "[download] GKI 源码第 $attempt 次"
              rm -f "$RUNNER_TEMP/gki.tar.gz"
              if curl -fSL --retry 3 --retry-delay 5 -o "$RUNNER_TEMP/gki.tar.gz" "$GKI_URL" \
                 && gzip -t "$RUNNER_TEMP/gki.tar.gz"; then ok=1; break; fi
              echo "[download] 下载失败或被截断，5s 后重试"; sleep 5
            done
            [ "$ok" = 1 ] || { echo "GKI 源码下载 3 次均失败/损坏"; exit 1; }
            ls -la "$RUNNER_TEMP/gki.tar.gz"
            mkdir -p common
            tar -xzf "$RUNNER_TEMP/gki.tar.gz" -C common
            rm -f "$RUNNER_TEMP/gki.tar.gz"
            test "$(find common -type f | wc -l)" -gt 10000 \
              || { echo "GKI 源码解压后文件数异常，可能下载不完整"; exit 1; }
          fi
          V="$(sed -n 's/^VERSION = //p' common/Makefile)"; P="$(sed -n 's/^PATCHLEVEL = //p' common/Makefile)"
          S="$(sed -n 's/^SUBLEVEL = //p' common/Makefile)"
          echo "上游版本: $V.$P.$S"
          test "$V.$P.$S" = "6.1.25" || { echo "上游版本不是 6.1.25"; exit 1; }
          ls common/fs/susfs.c 2>/dev/null && { echo "上游已有 fs/susfs.c？异常"; exit 1; } || true

      - name: 5.5 保存 Actions 缓存（本次未命中时，给下一次构建提速）
        if: steps.src-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ runner.temp }}/toolchain
            common
          key: meizu21-upstream-${{ env.GKI_SHA }}-${{ env.CLANG_ID }}-v2

      - name: 6. 打补丁 + 放入 SUSFS 内核实现
        run: |
          set -euo pipefail
          cd common
          git init -q . && git config user.email dsh@local && git config user.name dsh
          git apply --check ../patches/01-kernel-common.patch
          git apply ../patches/01-kernel-common.patch
          cp ../kernel-add/fs/susfs.c fs/susfs.c
          cp ../kernel-add/include/linux/susfs.h ../kernel-add/include/linux/susfs_def.h include/linux/
          # 01 补丁把 IKCONFIG 的内容指向 arch/arm64/configs/m2461_stock.config（/proc/config.gz 伪装）
          cp ../device/meizu21/stock_kernel.config arch/arm64/configs/m2461_stock.config
          echo "=== 补丁后自检 ==="
          grep -q 'ksu_handle_execveat' fs/exec.c && echo "OK fs/exec.c"
          grep -q 'susfs_is_data_local_tmp_dir' include/linux/susfs_def.h \
            || { echo "FAIL: include/linux/susfs_def.h 不是参考树版本（缺 susfs_is_data_local_tmp_dir）"; exit 1; }
          grep -q 'susfs_is_data_local_tmp_dir' fs/stat.c \
            || { echo "FAIL: 01 补丁没打全（fs/stat.c 缺调用）"; exit 1; }
          echo "OK susfs_def.h + fs/stat.c"
          grep -q 'm2461_stock.config' kernel/Makefile && echo "OK config_data 指向 m2461"
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig && echo "OK KSU Kconfig 已挂"

      - name: 7. 获取并集成 FinaSU（每次构建实时拉取，故意不进缓存）
        run: |
          set -euo pipefail
          WANT="${FINASU_INPUT:-latest}"
          if [ "$WANT" = "latest" ]; then
            echo "[finasu] 解析最新 release（用 releases/latest 的重定向，避开 API 限流）…"
            FINASU_REF="$(curl -sSIL -o /dev/null -w '%{url_effective}' \
              "https://github.com/${FINASU_REPO}/releases/latest" \
              | sed -nE 's#.*/tag/([^/]+).*#\1#p')"
          else
            FINASU_REF="$WANT"
          fi
          test -n "$FINASU_REF" || { echo "FinaSU 版本解析失败"; exit 1; }
          echo "[finasu] 使用 $FINASU_REF"
          git clone -q --depth 1 --branch "$FINASU_REF" "https://github.com/${FINASU_REPO}.git" FinaSU
          FINASU_COMMIT="$(git -C FinaSU rev-parse HEAD)"
          echo "[finasu] commit=$FINASU_COMMIT"
          {
            echo "FINASU_REF=$FINASU_REF"
            echo "FINASU_COMMIT=$FINASU_COMMIT"
          } >> "$GITHUB_ENV"
          cd common
          ../FinaSU/kernel/setup.sh --dir "$PWD/../FinaSU"
          test -e drivers/kernelsu/Kbuild || { echo "drivers/kernelsu 没接上"; exit 1; }
          echo "=== FinaSU SUSFS-Inline 入口自检 ==="
          sh ../FinaSU/kernel/tools/check_susfs_inline.sh "$PWD"
          echo "[finasu] 提示：若新版改了 inline hook API，会在这里或编译期失败；可用 finasu_ref=v1.5.0 固定版本"

      - name: 8. 生成 .config（原厂 config + FinaSU 开关 + olddefconfig）
        run: |
          set -euo pipefail
          cd common
          cp ../device/meizu21/stock_kernel.config .config
          sed -i '/^CONFIG_UNUSED_KSYMS_WHITELIST=/d' .config
          scripts/config --disable TRIM_UNUSED_KSYMS
          scripts/config --enable KSU
          scripts/config --enable KSU_SUSFS
          if [ "$HOOK_BACKEND" = "inline" ]; then
            scripts/config --enable KSU_HOOK_SUSFS_INLINE
            scripts/config --disable KSU_HOOK_TRACEPOINT
          else
            scripts/config --enable KSU_HOOK_TRACEPOINT
            scripts/config --disable KSU_HOOK_SUSFS_INLINE
          fi
          make ARCH=arm64 LLVM=1 olddefconfig
          echo "=== 关键配置 ==="
          grep -E '^CONFIG_(KSU|KSU_SUSFS|KSU_HOOK|KSU_DYNAMIC_MANAGER|KALLSYMS_ALL|KPROBES|EXT4_FS|THREAD_INFO_IN_TASK|HEADERS_INSTALL|TRIM_UNUSED_KSYMS|LTO_NONE|CFI_CLANG|LOCALVERSION|IKCONFIG)' .config || true
          echo "=== 断言 ==="
          need() { grep -q "^$1=y" .config || { echo "配置缺失: $1"; exit 1; }; }
          need CONFIG_KSU
          need CONFIG_KSU_SUSFS
          need CONFIG_KALLSYMS_ALL
          need CONFIG_KPROBES
          need CONFIG_EXT4_FS
          need CONFIG_THREAD_INFO_IN_TASK
          need CONFIG_HEADERS_INSTALL
          need CONFIG_LTO_NONE
          need CONFIG_CFI_CLANG
          need CONFIG_IKCONFIG
          grep -q '^# CONFIG_TRIM_UNUSED_KSYMS is not set' .config || { echo "TRIM_UNUSED_KSYMS 必须关闭"; exit 1; }
          if [ "$HOOK_BACKEND" = "inline" ]; then
            need CONFIG_KSU_HOOK_SUSFS_INLINE
            grep -q '^# CONFIG_KSU_HOOK_TRACEPOINT is not set' .config || { echo "inline 模式下 tracepoint 必须关闭"; exit 1; }
          else
            need CONFIG_KSU_HOOK_TRACEPOINT
          fi
          echo "配置 OK"

      - name: 9. 下载管理器 APK 并动态提取证书（与本次 FinaSU 版本严格对应）
        run: |
          set -euo pipefail
          # 用 releases/expanded_assets 的 HTML 片段拿资产直链（不需要 API token / 不受匿名限流影响）
          APK_PATH="$(curl -sSL --retry 3 \
            "https://github.com/${FINASU_REPO}/releases/expanded_assets/${FINASU_REF}" \
            | grep -oE 'href=\"/[^\"]*-release\.apk\"' | head -1 | sed -e 's/^href="//' -e 's/"$//')"
          test -n "$APK_PATH" || { echo "release 页面里找不到 -release.apk"; exit 1; }
          APK_URL="https://github.com${APK_PATH}"
          APK_NAME="$(basename "$APK_URL")"
          echo "APK: $APK_NAME"
          echo "URL: $APK_URL"
          curl -sSL --retry 5 --retry-delay 5 -o manager.apk "$APK_URL"
          SIZE="$(stat -c%s manager.apk)"
          SHA="$(sha256sum manager.apk | cut -d' ' -f1)"
          echo "APK size=$SIZE sha256=$SHA"
          CERT_LINE="$(python3 scripts/extract_manager_cert.py manager.apk | head -1)"
          echo "cert: $CERT_LINE"
          C_SIZE="$(echo "$CERT_LINE" | awk '{print $1}')"
          C_HASH="$(echo "$CERT_LINE" | awk '{print $2}')"
          test -n "$C_SIZE" -a -n "$C_HASH" || { echo "证书解析失败"; exit 1; }
          {
            echo "KSU_EXPECTED_SIZE=$C_SIZE"
            echo "KSU_EXPECTED_HASH=$C_HASH"
            echo "MANAGER_APK=$APK_NAME"
            echo "MANAGER_APK_SHA256=$SHA"
          } >> "$GITHUB_ENV"
          echo "证书（动态提取，不 pin）：size=$C_SIZE hash=$C_HASH"

      - name: 10. make headers_install（FinaSU preinit runner 依赖）
        run: |
          set -euo pipefail
          cd common
          make ARCH=arm64 LLVM=1 headers_install
          test -f usr/include/linux/unistd.h || { echo "usr/include 未生成，preinit 会被静默关闭"; exit 1; }
          echo "headers_install OK"

      - name: 11. 编译 Image（make, 非 kleaf）
        run: |
          set -euo pipefail
          cd common
          rm -f .version
          export PATH="$CLANG_BIN:$PATH"
          # KCFLAGS=-fno-temp-file：规避 clang 在高并发下偶发 "unable to rename temporary *.o.tmp"
          # （tree-analyst 本地实测：加上后产物逐字节一致，只影响临时文件策略）
          make -j"$MAKE_JOBS" ARCH=arm64 LLVM=1 LLVM_IAS=1 Image \
            KCFLAGS=-fno-temp-file \
            KSU_REQUIRE_PREINIT=1 \
            KSU_EXPECTED_SIZE="$KSU_EXPECTED_SIZE" \
            KSU_EXPECTED_HASH="$KSU_EXPECTED_HASH" 2>&1 | tee ../build_kernel.log
          test -f arch/arm64/boot/Image || { echo "没有 Image 产物"; exit 1; }
          # 只编 Image 时 modpost 产出的是 vmlinux.symvers（Module.symvers 只有编 modules 才有）
          test -f vmlinux.symvers || { echo "没有 vmlinux.symvers（modpost 失败？）"; exit 1; }
          ls -la arch/arm64/boot/Image vmlinux vmlinux.symvers
          echo "=== Linux version ==="
          grep -a -m1 'Linux version' arch/arm64/boot/Image | head -c 400; echo
          cp build_kernel.log ../build_kernel.log 2>/dev/null || true

      - name: 12. 门禁 1/3 —— release 串逐字符
        run: |
          set -euo pipefail
          cd common
          EXP="$(sed -n 's/^kernel_release[[:space:]]*=[[:space:]]*//p' "../$DEVICE_DIR/so.txt")"
          BANNER="$(grep -a -m1 'Linux version' arch/arm64/boot/Image)"
          echo "期望: $EXP"
          echo "实际: $BANNER"
          case "$BANNER" in
            *"$EXP"*) echo "PASS 门禁 1/3" ;;
            *) echo "FAIL 门禁 1/3：Image 里没有期望的 release 串"; exit 1 ;;
          esac
          KREL="$(cat include/config/kernel.release 2>/dev/null || true)"
          if [ -z "$KREL" ]; then
            KREL="$(make -s ARCH=arm64 LLVM=1 kernelrelease 2>/dev/null || true)"
          fi
          echo "kernel.release=$KREL"
          test "$KREL" = "$EXP" || { echo "FAIL: kernel.release 与期望不符"; exit 1; }
          {
            echo "release_expected=$EXP"
            echo "release_actual=$KREL"
            echo "banner=$BANNER"
          } > ../gate1_version.txt

      - name: 13. 门禁 2/3 —— KMI 审计（missing ∩ NEED 必须为空）
        run: |
          set -euo pipefail
          cd common
          python3 ../scripts/check_krcrc_symvers.py \
            vmlinux.symvers \
            "../$DEVICE_DIR/stock_Module.symvers" \
            "../$DEVICE_DIR/module_kmi_manifest.txt" \
            arch/arm64/boot/Image 2>&1 | tee ../gate2_kmi.log

      - name: 14. 门禁 3/3 —— kCFI 类型哈希
        run: |
          set -euo pipefail
          cd common
          set +e
          python3 ../scripts/check_kcfi.py vmlinux "$CLANG_BIN" "../$DEVICE_DIR/kcfi_expected.txt" 2>&1 | tee ../gate3_kcfi.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "check_kcfi exit=$RC"
          if [ "$RC" -ne 0 ]; then
            if [ "$STRICT_KCFI" = "true" ]; then
              echo "FAIL 门禁 3/3（strict_kcfi=true）"; exit 1
            fi
            echo "WARN 门禁 3/3 未全绿（strict_kcfi=false，继续；首刷后用 dmesg 回填期望值）"
          fi

      - name: 15. 重打包 boot.img（v1 原厂 vbmeta / v2 重算 digest）
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - "$DEVICE_DIR" <<'PY'
          import hashlib, sys, zlib, pathlib
          dev = pathlib.Path(sys.argv[1])
          meta = {}
          for line in (dev / "avb_template/source.txt").read_text(encoding="utf-8").splitlines():
              if line.startswith("#") or "=" not in line:
                  continue
              k, v = line.split("=", 1)
              meta[k.strip()] = v.strip()
          z = dev / "avb_template/stock_boot_skeleton.img.zlib"
          raw = zlib.decompress(z.read_bytes())
          sha = hashlib.sha256(raw).hexdigest()
          want = meta.get("skeleton_raw_sha256", "")
          print(f"[skeleton] {len(raw)} bytes sha256={sha} (expect {want})")
          assert len(raw) == 100663296, "skeleton 解压后不是 96 MiB"
          assert sha == want, "skeleton sha256 与 source.txt 记录不符（模板被换过？）"
          assert meta.get("boot_sha256", "").startswith("8c899eb3b7fcb65e"), "AVB 模板不是魅族 21 Flyme 12.7 的 boot"
          assert meta.get("device", "") == "meizu21", "AVB 模板不是 meizu21 机型"
          pathlib.Path("/tmp/stock_boot_skeleton.img").write_bytes(raw)
          print("[skeleton] OK")
          PY
          img_size="$(stat -c%s common/arch/arm64/boot/Image)"
          echo "Image size=$img_size"
          # AVB 骨架的 payload 被清零，AVB hash rule 无法校验；用「已知原厂事实」校验 descriptor 布局
          EXP_SIZE="$(sed -n 's/^avb_vbmeta_offset=//p' "$DEVICE_DIR/source.txt")"
          EXP_SALT="$(sed -n 's/^kernel_sha256=//p' "$DEVICE_DIR/source.txt")"
          echo "hash descriptor expectations: image_size=$EXP_SIZE salt=$EXP_SALT"
          test -n "$EXP_SIZE" -a -n "$EXP_SALT" || { echo "device facts 里缺 avb_vbmeta_offset/kernel_sha256"; exit 1; }
          test "$img_size" -lt 94371840 || { echo "Image 太大（>90 MiB），会超出 boot 分区 payload 安全区"; exit 1; }
          python3 scripts/repack_avb_boot.py common/arch/arm64/boot/Image /tmp/stock_boot_skeleton.img out/boot.img
          if [ "$EMIT_V2" = "true" ]; then
            python3 scripts/repack_avb_boot.py common/arch/arm64/boot/Image /tmp/stock_boot_skeleton.img \
              out/boot-v2digest.img --update-digest \
              --expect-image-size "$EXP_SIZE" --expect-salt "$EXP_SALT"
          fi
          python3 scripts/audit_boot.py out/boot.img | tee out/boot_avb_report.txt
          if [ -f out/boot-v2digest.img ]; then
            python3 scripts/audit_boot.py out/boot-v2digest.img | tee out/boot_avb_report_v2.txt
          fi
          ls -la out/
          (cd out && sha256sum * > sha256sums.txt && cat sha256sums.txt)

      - name: 16. 汇总产物
        run: |
          set -euo pipefail
          cp common/arch/arm64/boot/Image out/Image
          cp common/vmlinux.symvers out/vmlinux.symvers
          cp common/.config out/kernel.config
          cp manager.apk "out/${MANAGER_APK}"
          cp build_kernel.log out/ 2>/dev/null || true
          cp gate1_version.txt out/ 2>/dev/null || true
          cp gate2_kmi.log out/ 2>/dev/null || true
          cp gate3_kcfi.log out/ 2>/dev/null || true
          {
            echo "device=meizu21"
            echo "run=${{ github.run_number }}"
            echo "gki_sha=$GKI_SHA"
            echo "finasu_ref=${FINASU_REF} (${FINASU_COMMIT})"
            echo "hook_backend=$HOOK_BACKEND"
            echo "manager_apk=${MANAGER_APK}"
            echo "manager_apk_sha256=${MANAGER_APK_SHA256}"
            echo "ksu_expected_size=${KSU_EXPECTED_SIZE}"
            echo "ksu_expected_hash=${KSU_EXPECTED_HASH}"
            echo "clang_source=${CLANG_SOURCE:-unknown}"
            echo "kernel_image_size=$(stat -c%s out/Image)"
            echo "kernel_image_sha256=$(sha256sum out/Image | cut -d' ' -f1)"
            echo "built_at=$(date -u +%FT%TZ)"
          } | tee out/MANAGER_INFO.txt
          ls -la out/

      - name: 17. 发布 release + 更新 dist 分支
        if: env.PUBLISH == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="meizu21-${{ github.run_number }}"
          TITLE="魅族 21 GKI · FinaSU · ${HOOK_BACKEND} · run#${{ github.run_number }}"
          cat > /tmp/release_notes.md <<'EOF'
          设备：魅族 21（M2461 / Flyme 12.7）
          GKI：6.1.25-android14-11-maybe-dirty（android14-6.1-2023-10_r17）
          Root：FinaSU ${FINASU_REF}（内核内建 KSU，SUSFS Inline / Tracepoint 由 workflow 输入决定）

          产物：
          - boot.img（v1，原厂 vbmeta 字节）→ **先刷这个**
          - boot-v2digest.img（v2，重算 AVB hash descriptor）→ v1 不行再试
          - Image / Module.symvers / kernel.config / 门禁日志 / MANAGER_INFO.txt

          只刷非活动槽：
          ```
          fastboot flash boot_b boot.img
          fastboot --set-active=b
          # 起不来：fastboot --set-active=a
          ```

          **管理器必须装本 release 附带的 FinaSU APK**（内核里编的是它的证书哈希，装别的版本会显示“未安装”）。
          EOF
          gh release create "$TAG" --title "$TITLE" --notes-file /tmp/release_notes.md \
            out/boot.img out/boot-v2digest.img out/Image out/vmlinux.symvers out/kernel.config \
            "out/${MANAGER_APK}" out/boot_avb_report.txt out/gate1_version.txt \
            out/gate2_kmi.log out/gate3_kcfi.log out/MANAGER_INFO.txt out/sha256sums.txt \
            || echo "WARN: release 发布失败（不影响 dist 分支）"
          # dist 分支（本机 github.com HTTPS 不通，只能走这条取产物）
          mkdir -p /tmp/distpkg
          cp out/boot.img out/boot-v2digest.img out/Image out/vmlinux.symvers out/kernel.config \
             "out/${MANAGER_APK}" out/boot_avb_report.txt out/gate1_version.txt \
             out/gate2_kmi.log out/gate3_kcfi.log out/MANAGER_INFO.txt out/sha256sums.txt /tmp/distpkg/ 2>/dev/null || true
          cd /tmp/distpkg
          git init -q -b dist
          git config user.name "dsh-ci"
          git config user.email "dsh-ci@users.noreply.github.com"
          git add -A
          git commit -qm "dist: run ${{ github.run_number }} ($HOOK_BACKEND)"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist
          echo "dist 分支已更新: run ${{ github.run_number }}"

      - name: 18. 上传构建产物（无论成败）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: meizu21-gki-run-${{ github.run_number }}
          retention-days: 30
          path: |
            out/**
            build_kernel.log
            gate1_version.txt
            gate2_kmi.log
            gate3_kcfi.log
          if-no-files-found: warn

      - name: 19. 失败时打印关键日志
        if: failure()
        run: |
          echo "==== 最后 200 行编译日志 ===="
          tail -200 build_kernel.log 2>/dev/null || true
          echo "==== 门禁日志 ===="
          cat gate1_version.txt gate2_kmi.log gate3_kcfi.log 2>/dev/null || true
